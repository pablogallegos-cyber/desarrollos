<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estamos construyendo algo increíble</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, #263b73, transparent 35%),
                radial-gradient(circle at 80% 80%, #541c5d, transparent 35%),
                linear-gradient(135deg, #080b1c, #111936, #090b18);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           FONDO ANIMADO
        ========================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            opacity: .35;
            animation: float 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #00eaff;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: #ff00d4;
            right: -80px;
            bottom: -80px;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: #8b5cf6;
            right: 20%;
            top: 15%;
            animation-delay: 4s;
        }

        @keyframes float {

            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(40px, -40px) scale(1.2);
            }
        }

        /* =========================
           PARTÍCULAS
        ========================== */

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: .6;
            animation: particleMove linear infinite;
        }

        @keyframes particleMove {

            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: .8;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* =========================
           CONTENEDOR PRINCIPAL
        ========================== */

        .container {
            width: min(1100px, 90%);
            min-height: 600px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 40px;

            padding: 50px;

            border: 1px solid rgba(255,255,255,.15);
            border-radius: 30px;

            background: rgba(255,255,255,.07);
            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0,0,0,.4),
                inset 0 0 40px rgba(255,255,255,.03);

            animation: appear 1.5s ease forwards;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: scale(.8) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* =========================
           CONTENIDO
        ========================== */

        .content {
            animation: slideLeft 1.5s ease;
        }

        @keyframes slideLeft {

            from {
                opacity: 0;
                transform: translateX(-80px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .badge {
            display: inline-block;

            padding: 10px 18px;
            margin-bottom: 25px;

            border-radius: 50px;

            background: rgba(0,234,255,.12);
            border: 1px solid rgba(0,234,255,.5);

            color: #00eaff;

            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;

            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%, 100% {
                box-shadow: 0 0 0 rgba(0,234,255,0);
            }

            50% {
                box-shadow: 0 0 25px rgba(0,234,255,.4);
            }
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1;

            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #00eaff,
                #ff4fd8,
                #ffffff
            );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: gradientText 6s linear infinite;
        }

        @keyframes gradientText {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        .description {
            max-width: 500px;

            color: #c8d0e8;

            font-size: 1.1rem;
            line-height: 1.7;

            margin-bottom: 30px;
        }

        /* =========================
           BARRA DE PROGRESO
        ========================== */

        .progress-area {
            margin-top: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;

            font-size: 14px;
            color: #aeb8d3;
        }

        .progress-bar {
            height: 10px;

            background: rgba(255,255,255,.1);

            border-radius: 20px;

            overflow: hidden;
        }

        .progress {
            width: 72%;
            height: 100%;

            border-radius: 20px;

            background: linear-gradient(
                90deg,
                #00eaff,
                #8b5cf6,
                #ff4fd8
            );

            box-shadow: 0 0 20px #00eaff;

            animation: progressGlow 2s infinite alternate;
        }

        @keyframes progressGlow {

            from {
                filter: brightness(1);
            }

            to {
                filter: brightness(1.6);
            }
        }

        /* =========================
           BOTÓN
        ========================== */

        .btn {
            display: inline-block;

            margin-top: 30px;
            padding: 15px 28px;

            color: white;
            text-decoration: none;

            border-radius: 50px;

            background: linear-gradient(
                90deg,
                #00a8ff,
                #8b5cf6,
                #ff00d4
            );

            background-size: 200%;

            transition: .4s;

            box-shadow: 0 0 25px rgba(0,234,255,.3);
        }

        .btn:hover {
            background-position: 100%;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 40px rgba(255,0,212,.5);
        }

        /* =========================
           ILUSTRACIÓN SVG
        ========================== */

        .illustration {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: slideRight 1.5s ease;
        }

        @keyframes slideRight {

            from {
                opacity: 0;
                transform: translateX(80px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .svg-container {
            width: 100%;
            max-width: 500px;

            animation: levitate 4s ease-in-out infinite;
        }

        @keyframes levitate {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .rocket {
            transform-origin: center;
            animation: rocketMove 3s ease-in-out infinite;
        }

        @keyframes rocketMove {

            0%, 100% {
                transform: rotate(-4deg) translateY(0);
            }

            50% {
                transform: rotate(4deg) translateY(-12px);
            }
        }

        .flame {
            transform-origin: top;
            animation: flame 0.4s ease-in-out infinite alternate;
        }

        @keyframes flame {

            from {
                transform: scaleY(.7);
                opacity: .6;
            }

            to {
                transform: scaleY(1.2);
                opacity: 1;
            }
        }

        .gear {
            transform-origin: center;
            animation: rotateGear 8s linear infinite;
        }

        .gear.reverse {
            animation-direction: reverse;
        }

        @keyframes rotateGear {

            to {
                transform: rotate(360deg);
            }
        }

        .star {
            animation: starBlink 2s ease-in-out infinite alternate;
        }

        @keyframes starBlink {

            from {
                opacity: .3;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 800px) {

            body {
                overflow-y: auto;
                padding: 30px 0;
            }

            .container {
                grid-template-columns: 1fr;

                padding: 35px 25px;

                text-align: center;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .progress-area {
                text-align: left;
            }

            .illustration {
                order: -1;
            }

            .svg-container {
                max-width: 350px;
            }
        }

    </style>
</head>

<body>

    <!-- FONDO -->
    <div class="background">

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="particles" id="particles"></div>

    </div>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="container">


        <!-- TEXTO -->

        <section class="content">

            <span class="badge">
                🚀 Estamos trabajando
            </span>

            <h1>
                Algo increíble está por llegar
            </h1>

            <p class="description">

                Estamos construyendo una nueva experiencia para vos.
                Nuestro sitio se encuentra en desarrollo, pero muy pronto
                podrás descubrir todo lo que tenemos preparado.

            </p>


            <!-- PROGRESO -->

            <div class="progress-area">

                <div class="progress-info">

                    <span>Progreso del proyecto</span>

                    <span id="percentage">72%</span>

                </div>

                <div class="progress-bar">

                    <div class="progress"></div>

                </div>

            </div>


            <a href="#" class="btn" id="notifyButton">

                ✨ ¡Quiero enterarme!

            </a>

        </section>


        <!-- ILUSTRACIÓN SVG -->

        <section class="illustration">

            <div class="svg-container">

                <svg
                    viewBox="0 0 600 500"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- ESTRELLAS -->

                    <circle class="star" cx="80" cy="80" r="5" fill="#ffffff"/>
                    <circle class="star" cx="500" cy="80" r="6" fill="#00eaff"/>
                    <circle class="star" cx="540" cy="250" r="4" fill="#ff4fd8"/>
                    <circle class="star" cx="100" cy="330" r="4" fill="#8b5cf6"/>


                    <!-- PLANETA -->

                    <circle
                        cx="300"
                        cy="260"
                        r="145"
                        fill="#171f4c"
                        stroke="#00eaff"
                        stroke-width="4"
                    />

                    <ellipse
                        cx="300"
                        cy="260"
                        rx="205"
                        ry="55"
                        fill="none"
                        stroke="#ff4fd8"
                        stroke-width="8"
                        opacity=".8"
                        transform="rotate(-20 300 260)"
                    />


                    <!-- CRÁTERES -->

                    <circle cx="230" cy="200" r="25" fill="#26366c"/>
                    <circle cx="370" cy="280" r="35" fill="#26366c"/>
                    <circle cx="280" cy="350" r="20" fill="#26366c"/>


                    <!-- COHETE -->

                    <g class="rocket">

                        <path
                            d="M300 100
                               C330 120 350 165 350 215
                               L350 280
                               L250 280
                               L250 215
                               C250 165 270 120 300 100Z"

                            fill="#ffffff"
                            stroke="#00eaff"
                            stroke-width="5"
                        />

                        <!-- VENTANA -->

                        <circle
                            cx="300"
                            cy="180"
                            r="28"
                            fill="#151b3d"
                            stroke="#00eaff"
                            stroke-width="5"
                        />

                        <!-- ALETAS -->

                        <path
                            d="M250 245 L205 290 L250 280Z"
                            fill="#ff4fd8"
                        />

                        <path
                            d="M350 245 L395 290 L350 280Z"
                            fill="#ff4fd8"
                        />

                        <!-- LLAMA -->

                        <path
                            class="flame"
                            d="M270 280
                               Q300 350 330 280
                               Q300 310 270 280Z"

                            fill="#ffb000"
                        />

                        <path
                            class="flame"
                            d="M285 280
                               Q300 330 315 280
                               Q300 300 285 280Z"

                            fill="#ff4d00"
                        />

                    </g>


                    <!-- ENGRANAJE 1 -->

                    <g
                        class="gear"
                        transform="translate(110 150)"
                    >

                        <circle
                            r="45"
                            fill="none"
                            stroke="#8b5cf6"
                            stroke-width="12"
                            stroke-dasharray="15 10"
                        />

                        <circle
                            r="15"
                            fill="#8b5cf6"
                        />

                    </g>


                    <!-- ENGRANAJE 2 -->

                    <g
                        class="gear reverse"
                        transform="translate(470 350)"
                    >

                        <circle
                            r="50"
                            fill="none"
                            stroke="#00eaff"
                            stroke-width="12"
                            stroke-dasharray="15 10"
                        />

                        <circle
                            r="17"
                            fill="#00eaff"
                        />

                    </g>

                </svg>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        /*
        ==========================================
        GENERACIÓN DE PARTÍCULAS
        ==========================================
        */

        const particlesContainer =
            document.getElementById("particles");

        for (let i = 0; i < 45; i++) {

            const particle =
                document.createElement("div");

            particle.classList.add("particle");

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.animationDuration =
                (5 + Math.random() * 10) + "s";

            particle.style.animationDelay =
                Math.random() * 10 + "s";

            particle.style.opacity =
                Math.random();

            particlesContainer.appendChild(particle);

        }


        /*
        ==========================================
        BOTÓN INTERACTIVO
        ==========================================
        */

        const notifyButton =
            document.getElementById("notifyButton");

        notifyButton.addEventListener("click", function(event) {

            event.preventDefault();

            notifyButton.innerHTML =
                "🎉 ¡Gracias! Te avisaremos pronto";

            notifyButton.style.pointerEvents =
                "none";

        });


        /*
        ==========================================
        EFECTO DE MOVIMIENTO DEL MOUSE
        ==========================================
        */

        const container =
            document.querySelector(".container");

        document.addEventListener("mousemove", function(event) {

            const x =
                (window.innerWidth / 2 - event.clientX) / 40;

            const y =
                (window.innerHeight / 2 - event.clientY) / 40;

            container.style.transform =
                `perspective(1000px)
                 rotateY(${x}deg)
                 rotateX(${y}deg)`;

        });


        document.addEventListener("mouseleave", function() {

            container.style.transform =
                "perspective(1000px) rotateY(0deg) rotateX(0deg)";

        });

    </script>

</body>
</html>
