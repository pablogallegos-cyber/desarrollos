<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sitio en construcción</title>


<style>

    /* =========================
       RESET
    ========================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* =========================
       CUERPO
    ========================== */

    body {

        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        color: white;

        background:

            radial-gradient(
                circle at 10% 20%,
                #243b73,
                transparent 35%
            ),

            radial-gradient(
                circle at 90% 80%,
                #591d62,
                transparent 35%
            ),

            linear-gradient(
                135deg,
                #080b1c,
                #111936,
                #090b18
            );

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px;

        overflow-x: hidden;

    }


    /* =========================
       FONDO
    ========================== */

    .background {

        position: fixed;

        inset: 0;

        overflow: hidden;

        z-index: -1;

    }


    .orb {

        position: absolute;

        border-radius: 50%;

        filter: blur(12px);

        opacity: .35;

        animation:
            float 12s
            ease-in-out
            infinite
            alternate;

    }


    .orb-1 {

        width: 300px;

        height: 300px;

        background: #00eaff;

        top: -100px;

        left: -100px;

    }


    .orb-2 {

        width: 250px;

        height: 250px;

        background: #ff00d4;

        right: -80px;

        bottom: -80px;

        animation-delay: 2s;

    }


    .orb-3 {

        width: 180px;

        height: 180px;

        background: #8b5cf6;

        right: 20%;

        top: 15%;

        animation-delay: 4s;

    }


    @keyframes float {

        from {

            transform:
                translate(0, 0)
                scale(1);

        }

        to {

            transform:
                translate(40px, -40px)
                scale(1.2);

        }

    }


    /* =========================
       PARTÍCULAS
    ========================== */

    .particles {

        position: absolute;

        inset: 0;

        pointer-events: none;

    }


    .particle {

        position: absolute;

        width: 4px;

        height: 4px;

        background: white;

        border-radius: 50%;

        opacity: .6;

        animation:
            particleMove
            linear
            infinite;

    }


    @keyframes particleMove {

        from {

            transform:
                translateY(100vh);

            opacity: 0;

        }

        20% {

            opacity: 1;

        }

        80% {

            opacity: .8;

        }

        to {

            transform:
                translateY(-10vh);

            opacity: 0;

        }

    }


    /* =========================
       CONTENEDOR
    ========================== */

    .container {

        width: 100%;

        max-width: 1150px;

        min-height: 600px;

        display: grid;

        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1fr);

        align-items: center;

        gap: 50px;

        padding: clamp(25px, 5vw, 65px);

        border:

            1px solid
            rgba(255,255,255,.15);

        border-radius: 30px;

        background:

            rgba(255,255,255,.07);

        backdrop-filter:
            blur(20px);

        box-shadow:

            0 25px 80px
            rgba(0,0,0,.4),

            inset 0 0 40px
            rgba(255,255,255,.03);

        animation:

            appear
            1.2s
            ease
            forwards;

    }


    @keyframes appear {

        from {

            opacity: 0;

            transform:
                scale(.9)
                translateY(40px);

        }

        to {

            opacity: 1;

            transform:
                scale(1)
                translateY(0);

        }

    }


    /* =========================
       CONTENIDO
    ========================== */

    .content {

        animation:

            slideLeft
            1.2s
            ease;

    }


    @keyframes slideLeft {

        from {

            opacity: 0;

            transform:
                translateX(-60px);

        }

        to {

            opacity: 1;

            transform:
                translateX(0);

        }

    }


    .badge {

        display: inline-block;

        padding: 10px 18px;

        margin-bottom: 25px;

        border-radius: 50px;

        background:
            rgba(0,234,255,.12);

        border:

            1px solid
            rgba(0,234,255,.5);

        color: #00eaff;

        font-size: 13px;

        letter-spacing: 2px;

        text-transform: uppercase;

        animation:

            pulse
            2s
            infinite;

    }


    @keyframes pulse {

        0%, 100% {

            box-shadow:
                0 0 0
                rgba(0,234,255,0);

        }

        50% {

            box-shadow:
                0 0 25px
                rgba(0,234,255,.4);

        }

    }


    h1 {

        font-size:

            clamp(
                2.4rem,
                6vw,
                5rem
            );

        line-height: 1;

        margin-bottom: 25px;

        background:

            linear-gradient(
                90deg,
                #ffffff,
                #00eaff,
                #ff4fd8,
                #ffffff
            );

        background-size: 300%;

        -webkit-background-clip: text;

        background-clip: text;

        color: transparent;

        animation:

            gradientText
            6s
            linear
            infinite;

    }


    @keyframes gradientText {

        0% {

            background-position: 0%;

        }

        100% {

            background-position: 300%;

        }

    }


    .description {

        max-width: 520px;

        color: #c8d0e8;

        font-size:

            clamp(
                1rem,
                2vw,
                1.15rem
            );

        line-height: 1.7;

        margin-bottom: 30px;

    }


    /* =========================
       PROGRESO
    ========================== */

    .progress-area {

        margin-top: 25px;

    }


    .progress-info {

        display: flex;

        justify-content: space-between;

        gap: 15px;

        margin-bottom: 10px;

        font-size: 14px;

        color: #aeb8d3;

    }


    .progress-bar {

        height: 10px;

        background:
            rgba(255,255,255,.1);

        border-radius: 20px;

        overflow: hidden;

    }


    .progress {

        width: 72%;

        height: 100%;

        border-radius: 20px;

        background:

            linear-gradient(
                90deg,
                #00eaff,
                #8b5cf6,
                #ff4fd8
            );

        box-shadow:

            0 0 20px
            #00eaff;

        animation:

            progressGlow
            2s
            infinite
            alternate;

    }


    @keyframes progressGlow {

        from {

            filter:
                brightness(1);

        }

        to {

            filter:
                brightness(1.6);

        }

    }


    /* =========================
       ILUSTRACIÓN
    ========================== */

    .illustration {

        display: flex;

        align-items: center;

        justify-content: center;

        animation:

            slideRight
            1.2s
            ease;

    }


    @keyframes slideRight {

        from {

            opacity: 0;

            transform:
                translateX(60px);

        }

        to {

            opacity: 1;

            transform:
                translateX(0);

        }

    }


    .svg-container {

        width: 100%;

        max-width: 520px;

        animation:

            levitate
            4s
            ease-in-out
            infinite;

    }


    @keyframes levitate {

        0%, 100% {

            transform:
                translateY(0);

        }

        50% {

            transform:
                translateY(-15px);

        }

    }


    /* =========================
       SVG
    ========================== */

    .gear {

        transform-origin: center;

        animation:

            rotateGear
            8s
            linear
            infinite;

    }


    .gear.reverse {

        animation-direction:
            reverse;

    }


    @keyframes rotateGear {

        to {

            transform:
                rotate(360deg);

        }

    }


    .star {

        animation:

            starBlink
            2s
            ease-in-out
            infinite
            alternate;

    }


    @keyframes starBlink {

        from {

            opacity: .3;

            transform:
                scale(.7);

        }

        to {

            opacity: 1;

            transform:
                scale(1.3);

        }

    }


    .code-line {

        animation:

            codeAnimation
            2s
            ease-in-out
            infinite
            alternate;

    }


    @keyframes codeAnimation {

        from {

            opacity: .3;

        }

        to {

            opacity: 1;

        }

    }


    /* =========================
       RESPONSIVE TABLET
    ========================== */

    @media (max-width: 900px) {

        body {

            padding: 20px;

        }


        .container {

            grid-template-columns: 1fr;

            min-height: auto;

            gap: 30px;

        }


        .illustration {

            order: -1;

        }


        .svg-container {

            max-width: 420px;

        }


    }


    /* =========================
       RESPONSIVE CELULAR
    ========================== */

    @media (max-width: 600px) {

        body {

            padding: 15px;

            align-items: flex-start;

            padding-top: 30px;

        }


        .container {

            padding: 30px 20px;

            border-radius: 22px;

            gap: 20px;

        }


        .content {

            text-align: center;

        }


        .badge {

            font-size: 11px;

            letter-spacing: 1px;

        }


        h1 {

            font-size: 2.7rem;

        }


        .description {

            font-size: 1rem;

        }


        .progress-info {

            font-size: 12px;

        }


        .svg-container {

            width: 95%;

        }

    }


    /* =========================
       CELULARES MUY PEQUEÑOS
    ========================== */

    @media (max-width: 380px) {

        h1 {

            font-size: 2.2rem;

        }


        .container {

            padding: 25px 15px;

        }

    }

</style>

<!-- JAVASCRIPT -->

<script>


    /*
    ============================
    GENERACIÓN DE PARTÍCULAS
    ============================
    */


    const particlesContainer =
        document.getElementById(
            "particles"
        );


    for (
        let i = 0;
        i < 45;
        i++
    ) {


        const particle =
            document.createElement(
                "div"
            );


        particle.classList.add(
            "particle"
        );


        particle.style.left =
            Math.random() * 100 + "%";


        particle.style.animationDuration =
            (5 + Math.random() * 10)
            + "s";


        particle.style.animationDelay =
            Math.random() * 10
            + "s";


        particle.style.opacity =
            Math.random();


        particlesContainer.appendChild(
            particle
        );


    }


    /*
    ============================
    EFECTO 3D CON EL MOUSE
    ============================
    */


    const container =
        document.querySelector(
            ".container"
        );


    document.addEventListener(
        "mousemove",
        function(event) {


            if (
                window.innerWidth <= 900
            ) {

                return;

            }


            const x =
                (
                    window.innerWidth / 2
                    - event.clientX
                ) / 60;


            const y =
                (
                    window.innerHeight / 2
                    - event.clientY
                ) / 60;


            container.style.transform =

                `perspective(1000px)
                 rotateY(${x}deg)
                 rotateX(${y}deg)`;

        }

    );


    document.addEventListener(
        "mouseleave",
        function() {


            container.style.transform =

                "perspective(1000px)
                 rotateY(0deg)
                 rotateX(0deg)";

        }

    );


</script>
